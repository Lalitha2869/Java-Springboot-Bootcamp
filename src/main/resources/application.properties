# =========================================================
# APPLICATION
# =========================================================

spring.application.name=book-api

# Day 6 was already using 8081 because 8080 was occupied.
server.port=8081


# =========================================================
# MYSQL DATABASE
# =========================================================

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/bookdb

# MySQL username
spring.datasource.username=root

# IMPORTANT:
# Password is read from the DB_PASSWORD environment variable.
# Do NOT put your real password directly into Git.
spring.datasource.password=root


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Automatically create/update tables based on our entities.
# Good for learning/development.
spring.jpa.hibernate.ddl-auto=update

# Display SQL generated by Hibernate in the console.
spring.jpa.show-sql=true

# Format generated SQL so it is easier to read.
spring.jpa.properties.hibernate.format_sql=true